# CI: build, test and style gate on every push / pull request.
# Matrix: gcc + clang + gcc -m32 (ILP32) on Linux - the platform policy
# targets embedded Linux; the wider matrix stays in tools/verify_platforms.sh.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            flags: ""
            name: gcc
          - cc: clang
            flags: ""
            name: clang
          - cc: gcc
            flags: "-m32"
            name: gcc-ilp32
    name: ${{ matrix.name }}
    env:
      CC: ${{ matrix.cc }}
      EXTRA_FLAGS: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-format clang-tidy \
                                  python3 python3-pyelftools gcc-multilib libc6-dev-i386

      - name: configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_C_FLAGS="$EXTRA_FLAGS"
          -DCMAKE_EXE_LINKER_FLAGS="$EXTRA_FLAGS"

      - name: build
        run: cmake --build build -j

      - name: test
        run: ctest --test-dir build --output-on-failure

      - name: style gate
        run: tools/check-style.sh
        env:
          BUILD: build

      - name: api symbols guard
        run: tools/check-api-symbols.sh

      - name: demos
        run: |
          ./build/programs/shrewd-basic-formats-demo
          ./build/programs/shrewd-basic-dbus-demo
